[bar/main]
width = 100%
height = 24
background = #2e3440
foreground = #d8dee9
font-0 = monospace:size=10
modules-left = bspwm
modules-center = date
modules-right = volume battery

[module/bspwm]
type = internal/bspwm
format = <label-state>
label-focused = %index%
label-occupied = %index%
label-empty = %index%

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d%
time = %H:%M

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %percentage%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
